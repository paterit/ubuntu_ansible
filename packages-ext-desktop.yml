- name: Install extended desktop packages and applications
  hosts: localhost
  become: false  # elevate per-task; Homebrew must stay non-root.

  vars:
    apt_packages:
      - geany
      - git-gui
      - meld
      - keepass2
      - simplescreenrecorder
      - xournalpp

    snap_packages:
      - code
      - spotify
      - multipass
      - firefox

  tasks:
    - name: Install macOS desktop apps via casks
      community.general.homebrew_cask:
        name: "{{ mac_casks }}"
        state: present
      when: ansible_system == "Darwin"

    - name: Install Linux desktop applications
      when: ansible_system == "Linux"
      block:
        - name: Repo for Keepass2
          become: true
          ansible.builtin.apt_repository:
            repo: ppa:ubuntuhandbook1/keepass2
            state: present

        - name: Install standard apt packages
          become: true
          ansible.builtin.apt:
            name: "{{ apt_packages }}"
            state: present

        - name: Install and config snap packages
          block:
            - name: Install snap packages
              become: true
              community.general.snap:
                name: "{{ item }}"
                state: present
                classic: true
              loop: "{{ snap_packages }}"

            - name: Config line for snap to enable application search
              become: true
              ansible.builtin.lineinfile:
                create: true
                path: /etc/zsh/zprofile
                line: "emulate sh -c 'source /etc/profile.d/apps-bin-path.sh'"
                mode: "0644"
                state: present

        - name: Update firefox to latest version # snap install will not update if already installed
          block:
            - name: Kill running firefox processes
              become: true
              ansible.builtin.command: pkill firefox
              changed_when: false
              failed_when: false

            - name: Update firefox package
              become: true
              ansible.builtin.command: snap refresh firefox
              changed_when: false

        - name: Install Alacritty
          become: true
          block:
            - name: Add Alacritty repository
              ansible.builtin.apt_repository:
                repo: ppa:aslatter/ppa
                state: present
                update_cache: true

            - name: Install Alacritty
              ansible.builtin.apt:
                name: alacritty
                state: present
