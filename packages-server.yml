- name: Install base server packages
  hosts: localhost
  become: false  # Homebrew must not run as root; apt task elevates on its own.

  tasks:
    - name: Install standard apt packages - server (Linux)
      become: true
      ansible.builtin.apt:
        name: "{{ server_packages['Linux'] }}"
        state: present
      when: ansible_system == "Linux"

    - name: Install standard brew packages - server (macOS)
      community.general.homebrew:
        name: "{{ server_packages['Darwin'] }}"
        state: present
      when: ansible_system == "Darwin"
